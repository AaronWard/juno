[supervisord]
nodaemon=true
logfile=/outputs/cache/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:acestep]
; ACE-Step 1.5 API server. Juno's proxy owns model loading (one DiT at a
; time, swapped through its queue), so this launcher enforces the settings
; that make that safe even if an older compose file still sets them:
;  - ACESTEP_CONFIG_PATH2/3 are UNSET: otherwise the first request lazy-loads
;    all three XL DiTs (~27 GB) + the 4B LM and runs out of VRAM, and jobs for
;    a model that failed to load silently fall back to the primary.
;  - model paths become bare NAMES so ACE-Step's per-variant model-code sync
;    runs (it is keyed on the name; absolute paths skip it).
;  - the LM backend always matches what the proxy sends (JUNO_LM_BACKEND,
;    default pt; vllm is broken on Blackwell without flash-attn).
command=/bin/bash -lc 'unset ACESTEP_CONFIG_PATH2 ACESTEP_CONFIG_PATH3; export ACESTEP_CONFIG_PATH="$(basename "${ACESTEP_CONFIG_PATH:-acestep-v15-xl-turbo}")"; export ACESTEP_LM_MODEL_PATH="$(basename "${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-4B}")"; export ACESTEP_LM_BACKEND="${JUNO_LM_BACKEND:-pt}"; cd /app/ACE-Step-1.5 && exec uv run acestep-api --host ${ACESTEP_API_HOST:-0.0.0.0} --port ${ACESTEP_API_PORT:-8001}'
directory=/app/ACE-Step-1.5
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:muscriptor]
; Audio -> MIDI server. Started on demand by the Juno proxy and stopped after
; the idle timeout (Settings). Model size comes from ${JUNO_DATA_DIR}/muscriptor-model
; so the UI can switch small/medium/large without editing this file.
command=/bin/bash -lc 'exec /opt/muscriptor/bin/muscriptor serve --host 127.0.0.1 --port 8002 --model "$(cat ${JUNO_DATA_DIR:-/data}/muscriptor-model 2>/dev/null || echo ${MUSCRIPTOR_MODEL:-medium})"'
directory=/tmp
autostart=false
autorestart=unexpected
startsecs=5
stopwaitsecs=15
environment=TORCH_HOME="/models/torch-cache",PYTHONUNBUFFERED="1"
stdout_logfile=/outputs/cache/muscriptor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
priority=30

[program:juno-proxy]
command=/bin/bash -lc "cd /app/juno/ace_proxy && exec node dist/server.js"
directory=/app/juno/ace_proxy
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
